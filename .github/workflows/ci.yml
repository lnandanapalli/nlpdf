name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Lint, Security, Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libglib2.0-dev unixodbc-dev
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 2.5.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Cache Poetry virtualenv
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-
      - name: Install dependencies
        run: |
          poetry install
      - name: Pre-commit checks
        run: poetry run pre-commit run --all-files
      - name: Run Backend Tests
        run: |
          docker compose up -d sqlserver
          # Wait for SQL Server
          echo "Waiting for SQL Server..."
          until docker exec nlpdf_sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'NlpdfPass123!' -Q 'SELECT 1' -No; do
            sleep 5
          done
          poetry run alembic upgrade head
          poetry run pytest tests/ -v --cov=backend --cov-report=term-missing
        env:
          APP_ENV: development
          DB_PASSWORD: NlpdfPass123! # pragma: allowlist secret
          DB_HOST: localhost
          DB_PORT: 1433
          DB_NAME: master
          DB_USER: sa
          DB_DRIVER: ODBC Driver 18 for SQL Server
          HUGGINGFACE_API_TOKEN: mock # pragma: allowlist secret
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long # pragma: allowlist secret
          RESEND_API_KEY: mock # pragma: allowlist secret
          CLOUDFLARE_TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA # pragma: allowlist secret

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:coverage
      - name: Build
        run: npm run build

  docker:
    name: Docker image (build & smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image
        run: docker build -t nlpdf-backend:ci .
      - name: Every native library resolves
        # A shared library missing at runtime only shows up as a failure on
        # first use (e.g. the ODBC driver needs libgssapi_krb5), so check all.
        run: |
          docker run --rm --entrypoint sh nlpdf-backend:ci -c '
            missing=$(find /opt/venv /opt/microsoft -name "*.so*" -type f -exec ldd {} \; 2>/dev/null | grep "not found" || true)
            if [ -n "$missing" ]; then echo "$missing"; exit 1; fi'
      - name: Runs as non-root, ships no compiler, ODBC driver is registered
        run: |
          docker run --rm --entrypoint sh nlpdf-backend:ci -c '
            set -e
            test "$(whoami)" = appuser
            if command -v gcc; then echo "gcc shipped in the final image"; exit 1; fi
            python -c "import pyodbc; assert \"ODBC Driver 18 for SQL Server\" in pyodbc.drivers()"'
      - name: Starts in production mode and serves requests
        # Dummy values: the app needs them to start; nothing is called.
        env:
          APP_ENV: production
          HUGGINGFACE_API_TOKEN: dummy # pragma: allowlist secret
          DB_PASSWORD: dummy # pragma: allowlist secret
          JWT_SECRET_KEY: ci-smoke-secret-key-at-least-32-characters # pragma: allowlist secret
          RESEND_API_KEY: dummy # pragma: allowlist secret
          CLOUDFLARE_TURNSTILE_SECRET_KEY: dummy # pragma: allowlist secret
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e APP_ENV -e HUGGINGFACE_API_TOKEN -e DB_PASSWORD -e JWT_SECRET_KEY \
            -e RESEND_API_KEY -e CLOUDFLARE_TURNSTILE_SECRET_KEY \
            nlpdf-backend:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/ && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "NLPDF API is running"
          if docker logs smoke 2>&1 | grep -q "Could not configure file logging"; then
            docker logs smoke
            exit 1
          fi

  e2e:
    name: Full Stack E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libglib2.0-dev unixodbc-dev
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 2.5.1
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Backend Dependencies
        run: |
          poetry install
      
      - name: Start Database (SQL Server)
        run: docker compose up -d sqlserver

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci
      
      - name: Install Playwright Browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Configure and migrate the backend
        run: | # pragma: allowlist secret
          echo "APP_ENV=development" > .env
          echo "JWT_SECRET_KEY=ci-test-secret-key-at-least-32-chars-long" >> .env # pragma: allowlist secret
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=1433" >> .env
          echo "DB_USER=sa" >> .env
          echo "DB_PASSWORD=NlpdfPass123!" >> .env # pragma: allowlist secret
          echo "DB_NAME=master" >> .env
          echo "DB_DRIVER=ODBC Driver 18 for SQL Server" >> .env
          echo "HUGGINGFACE_API_TOKEN=mock" >> .env
          echo "RESEND_API_KEY=mock" >> .env
          echo "CLOUDFLARE_TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> .env # pragma: allowlist secret

          echo "Waiting for SQL Server..."
          until docker exec nlpdf_sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'NlpdfPass123!' -Q 'SELECT 1' -No; do
            sleep 5
          done
          poetry run alembic upgrade head

      # Playwright starts the e2e backend (tests/e2e_support/app.py: real app,
      # fake LLM, captured email) and the Vite dev server itself.
      - name: Run Playwright Tests
        run: cd frontend && npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
