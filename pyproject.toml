[tool.poetry]
name = "nlpdf"
version = "0.1.0"
description = "AI-powered PDF processing using natural language"
authors = ["Lokeshwar Reddy"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = ">=0.135.1,<0.142.0"
uvicorn = {extras = ["standard"], version = ">=0.41,<0.53"}
pypdf = ">=6.7.5"
python-multipart = ">=0.0.22,<0.0.33"
pikepdf = "^10.5.0"
slowapi = "^0.1.9"
huggingface-hub = "^1.7.1"
python-dotenv = "^1.2.2"
pydantic-settings = "^2.13.1"
structlog = ">=25.5,<27.0"
sqlalchemy = "^2.0.48"
aioodbc = "^0.5.0"
pyodbc = "^5.2.0"
alembic = "^1.15"
PyJWT = "^2.12"
email-validator = "^2.2"
resend = "^2.23.0"
httpx = "^0.28.1"
argon2-cffi = "^25.1.0"
markdown = "^3.10.2"
xhtml2pdf = "^0.2.17"
Pillow = "^12.1.0"
user-agents = "^2.2.0"
nh3 = "^0.3.3"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.6,<0.17.0"
black = "^26.3.1"
bandit = "^1.9.4"
pre-commit = "^4.5.1"
ty = ">=0.0.23,<0.0.73"
pytest = ">=8,<10"
pytest-asyncio = "^1.3"
httpx = "^0.28"
aiosqlite = "^0.22"
pip-audit = "^2.10.0"
detect-secrets = "^1.5.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's asyncio layer bridges sync and async through greenlets, and
# coverage cannot follow execution into a greenlet unless told to. Without
# this, endpoint bodies that await the database are reported as unexecuted
# even when the test provably runs them -- auth_router measured 49% instead
# of its real 81%.
concurrency = ["greenlet", "thread"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["migrations", ".venv", ".git", "alembic"]

[tool.ruff.lint]
# Explicit rule selection - deliberately NOT "ALL".
# With "ALL", every ruff release auto-enables newly stabilised rules, so a
# routine dependency bump breaks CI on code that never changed. Enabling a
# family here is an intentional decision, reviewed like any other change.
select = [
    # --- Core correctness ---
    "F",         # pyflakes - undefined names, unused imports
    "E", "W",    # pycodestyle
    "B",         # bugbear - likely bugs
    "RUF",       # ruff-specific, incl. RUF100 unused-noqa

    # --- Imports & naming ---
    "I",         # isort
    "N",         # pep8-naming
    "TID",       # tidy-imports - enforces absolute imports
    "A",         # builtin shadowing

    # --- Modernisation & clarity ---
    "UP",        # pyupgrade - py313 idioms
    "C4",        # comprehensions
    "SIM",       # simplify
    "PIE",       # misc lints
    "RET",       # return-statement hygiene
    "PTH",       # prefer pathlib

    # --- Correctness for this stack ---
    "S",         # flake8-bandit - security
    "ASYNC",     # async pitfalls
    "DTZ",       # timezone-aware datetimes
    "LOG", "G",  # logging correctness
    "PT",        # pytest style
    "T20",       # no stray print()

    # --- Documentation & typing ---
    "D",         # pydocstyle (google convention, configured below)
    "ANN",       # require annotations
]

# Deliberately not selected: PLR/PLW/PLC and C90 (arbitrary numeric thresholds
# that shift between releases), plus TRY/EM/FBT/BLE/COM/ERA/TD (style opinions).
# These caused the recurring upgrade breakages without catching real defects.

ignore = [
    # --- Formatting is Black's job ---
    "E501",     # line length - Black wraps; long URLs/strings legitimately exceed

    # --- Google docstring convention ---
    # convention = "google" implies D211 + D213; D203/D212 are their opposites.
    "D203",     # one blank line before class docstring - conflicts with D211
    "D212",     # multi-line summary on first line - conflicts with D213
    "D100",     # missing docstring in public module - entry points exempt
    "D104",     # missing docstring in public package - __init__.py files
    "D401",     # imperative mood - too prescriptive for descriptive docstrings

    # --- FastAPI patterns ---
    "B008",     # function calls in default args - the `Depends()` pattern
    "ANN401",   # disallows `Any` - required for SQLAlchemy/Pydantic generics

    # --- structlog ---
    "G004",     # f-string in logging call - structlog uses kwargs
    "LOG015",   # root logger - structlog wraps the stdlib logger
]

[tool.ruff.lint.per-file-ignores]
"backend/auth/dependencies.py" = ["ANN"]   # FastAPI Depends() signatures
"backend/main.py"              = ["I001"]  # platform workaround splits the stdlib block
"tests/**"                     = ["ANN", "S", "D", "PTH", "RET", "SIM108"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["backend"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.black]
target-version = ["py313"]
line-length = 100

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B110"]  # try/except/pass — intentional in logout (documented)

[tool.ty.rules]
# user_agents has no py.typed marker; the runtime import is fine.
unresolved-import = "ignore"

# ty runs on two platforms here (Windows dev, Linux CI). A suppression that is
# required on one is necessarily unused on the other -- the Windows-only event
# loop policy call in backend/main.py is flagged as deprecated on Windows and
# not resolved at all on Linux. Enforcing this rule would mean CI failing on
# code that never changed, which is the exact trap `select = ["ALL"]` created.
unused-ignore-comment = "ignore"
